# PAKET: config.yaml
# Konfigurasi tunggal project presensi (single source of truth)
project:
  name: presensi
  model_version: "buffalo_l"   # wajib tercatat di gallery & log; ganti backbone = re-enroll

paths:
  models_dir: models          # buffalo_l + anti-spoof (gitignored)
  gallery_dir: data           # galeri embedding (gitignored)

verify:
  frames_min_valid: 3         # minimal frame valid agar voting sah
  consensus_ratio: 0.70       # >=70% frame valid sepakat kandidat sama -> match sah
  median_top_gap: 0.00        # cadangan: margin top1-top2 utk mode 1:N (v1: 1:1 saja)

match:
  # placeholder M1 — angka final dari evaluasi M4 (FAR/FRR), JANGAN di-tune manual
  threshold: 0.40
  aggregation: max          # max = cosine terbaik antar gambar enroll (robust pose)

enroll:
  min_images: 3             # minimal gambar lolos agar enroll sah (ideal 5-10, DESAIN §5)

api:
  host: 0.0.0.0                # 0.0.0.0 = bisa diakses perangkat lain di WiFi (demo Raihan)
  port: 8000
  api_key: dev-key-change-me   # WAJIB override via env PRES_API_KEY di deployment
  max_images: 20               # batas file per request (enroll/verify)

quality:
  # MODE INTEGRASI-TEST: sengaja sangat longgar (Raihan testing flow, bukan akurasi).
  # Kembalikan ke nilai kalibrasi saat M4c: blur 35-60, face_min 112, bright 40-240.
  blur_min_variance: 5.0      # hampir semua lolos
  face_min_px: 40             # wajah kecil pun lolos
  brightness_min: 5.0
  brightness_max: 250.0

antispoof:
  model_dir: third_party/Silent-Face-Anti-Spoofing/resources/anti_spoof_models
  # ensemble sesuai plan resmi referensi (test.py): V2 crop 2.7x + V1SE full frame
  models:
    - name: 2.7_80x80_MiniFASNetV2.pth
      scale: 2.7
    - name: 4_0_0_80x80_MiniFASNetV1SE.pth
      scale: null        # null = full frame (crop=false)
  real_threshold: 0.50        # P(real) >= 0.5 dianggap hidup
